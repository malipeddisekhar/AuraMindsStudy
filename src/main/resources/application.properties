spring.application.name=auraminds-app
app.access.code-hash=${ACCESS_CODE_HASH:9a7ee9ac01d74171d10a12e586d6829e00078bd8275637704f35054e4b16cf8d}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
# Dialect is auto-detected by Hibernate based on the datasource connection.
# No explicit dialect needed - Hibernate will detect H2 or MySQL automatically.

spring.jackson.time-zone=UTC
# Serialize LocalDate/LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

# Session timeout (30 minutes of inactivity)
server.servlet.session.timeout=30m

# Reduce startup noise
logging.level.root=WARN
logging.level.com.augmind=INFO
logging.level.org.springframework.boot.actuate.autoconfigure=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.apache.coyote.http11.Http11InputBuffer=ERROR
logging.level.org.springframework.data=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate=WARN

# Suppress banner and reduce startup output
spring.main.banner-mode=off
spring.boot.logStartupInfo=false