services:
  - type: web
    name: augmind-app
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    # Render injects PORT automatically; the app reads ${PORT:8080}
    envVars:
      - key: PORT
        value: 10000
      - key: ACCESS_CODE_HASH
        sync: false   # set this secret in the Render dashboard
      # MySQL Database Configuration (set these in Render dashboard)
      # If not set, app will fall back to in-memory H2 database
      - key: SPRING_DATASOURCE_URL
        sync: false   # e.g., jdbc:mysql://your-mysql-host:3306/augmind?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # MySQL username
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # MySQL password
    # /health returns {"status":"UP"} — fast, no session, no redirect
    healthCheckPath: /health
