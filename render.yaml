services:
  - type: web
    name: augmind-app
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    # Render injects PORT automatically; the app reads ${PORT:8080}
    envVars:
      - key: PORT
        value: 10000
      - key: ACCESS_CODE_HASH
        sync: false   # set this secret in the Render dashboard
    # /health returns {"status":"UP"} — fast, no session, no redirect
    healthCheckPath: /health
